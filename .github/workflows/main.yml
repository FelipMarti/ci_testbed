name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  post_merge_tests:
    name: Post-merge tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: pip install --retries 5 --timeout 60 -e ".[dev]"
      - name: Create reports directory
        run: mkdir -p reports
      - name: Run full suite with coverage
        run: >
          pytest -n auto
          -m "not docker and not hardware"
          --timeout=120
          --durations=20
          --log-file=reports/pytest-main.log
          --cov=ci_testbed
          --cov-fail-under=85
          --cov-report=term-missing
          --cov-report=xml:reports/coverage-main.xml
          --cov-report=html:reports/htmlcov
          --junitxml=reports/junit-main.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: main-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  build_package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: pip install --retries 5 --timeout 60 build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: main-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  container_images:
    name: Container images and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [post_merge_tests, build_package]
    if: ${{ vars.ENABLE_DOCKER_JOBS == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Normalize image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/ci-testbed-mocks" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: pip install --retries 5 --timeout 60 -e ".[dev]"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: Build and publish mock image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pull tested image
        run: docker pull "${IMAGE_NAME}:sha-${GITHUB_SHA}"
      - name: Create reports directory
        run: mkdir -p reports
      - name: Smoke test published image
        env:
          CI_TESTBED_MOCKS_IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          CI_TESTBED_SKIP_BUILD: "1"
        run: >
          pytest -m "docker and smoke"
          --timeout=120
          --log-file=reports/pytest-main-docker.log
          --junitxml=reports/junit-main-docker.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: main-docker-logs
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  main_summary:
    name: Main summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [post_merge_tests, build_package, container_images]
    steps:
      - name: Write job summary
        run: |
          {
            echo "## Main results"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Post-merge tests | ${{ needs.post_merge_tests.result }} |"
            echo "| Build package | ${{ needs.build_package.result }} |"
            echo "| Container images | ${{ needs.container_images.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
