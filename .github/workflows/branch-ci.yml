name: Branch CI

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-py3.12-
      - name: Install project
        run: pip install --retries 5 --timeout 60 -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.12-
      - name: Install project
        run: pip install --retries 5 --timeout 60 -e ".[dev]"
      - run: mypy src

  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: pip install --retries 5 --timeout 60 -e ".[dev]"
      - name: Run unit tests in parallel
        run: >
          pytest -m unit -n auto
          --timeout=30
          --durations=20
          --log-file=reports/pytest-unit-py${{ matrix.python-version }}.log
          --junitxml=reports/junit-unit-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-unit-reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  branch_summary:
    name: Branch CI summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, typecheck, unit]
    steps:
      - name: Write job summary
        run: |
          {
            echo "## Branch CI results"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Typecheck | ${{ needs.typecheck.result }} |"
            echo "| Unit | ${{ needs.unit.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
