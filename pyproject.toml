[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-testbed"
version = "0.1.0"
description = "CI testbed with pytest and GitHub Actions." 
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-rerunfailures>=14.0",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
]

[project.scripts]
ci-testbed = "ci_testbed.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ci_testbed = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not docker and not hardware"]
markers = [
  "unit: fast, isolated tests with no external I/O",
  "integration: tests that combine a few real in-process components",
  "system: full pick-and-place pipeline tests",
  "contract: shared behaviour expected from every adapter implementation",
  "slow: tests that are too slow for the default PR pipeline",
  "docker: tests that require the containerised mock services",
  "smoke: fast end-to-end checks for a freshly built container image",
  "hardware: tests that require a self-hosted ROS2 or hardware runner",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ci_testbed"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PT"]
ignore = ["PT011"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT006"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
